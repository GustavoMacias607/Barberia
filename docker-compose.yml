services:

    sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest

        container_name: barberia-sqlserver

        environment:
            ACCEPT_EULA: Y
            MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

        ports:
            - "1433:1433"

        volumes:
            - barberia_sql_data:/var/opt/mssql

        restart: unless-stopped

volumes:
    barberia_sql_data:
